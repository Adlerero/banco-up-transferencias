<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco UP - Nueva Transferencia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="form-card">

            <div class="user-header">
                <div class="form-title">Nueva Transferencia</div>
                <button class="btn-outline" onclick="window.location.href='dashboard.html'">← Regresar</button>
            </div>

            <div id="error-msg" class="error-msg" style="display:none;"></div>

            <div class="input-group">
                <label>Número de Cuenta Destino (16 dígitos)</label>
                <input type="text" id="cuenta_destino" placeholder="0000 0000 0000 0000" maxlength="19">
            </div>

            <div class="input-group">
                <label>Concepto</label>
                <input type="text" id="concepto" placeholder="Ej. Pago de renta">
            </div>

            <div class="input-group">
                <label>Monto (MXN)</label>
                <input type="number" id="monto" placeholder="0.00" min="500" step="0.01">
            </div>

            <button class="btn-primary" onclick="continuar()">Continuar</button>

        </div>
    </div>

    <script>
        const token = localStorage.getItem('token')
        if (!token) window.location.href = 'index.html'

        // Formatear cuenta destino
        document.getElementById('cuenta_destino').addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '').substring(0, 16)
            e.target.value = val.replace(/(.{4})/g, '$1 ').trim()
        })

        async function continuar() {
            const cuenta_destino = document.getElementById('cuenta_destino').value.replace(/\s/g, '')
            const concepto = document.getElementById('concepto').value.trim()
            const monto = parseFloat(document.getElementById('monto').value)
            const errorMsg = document.getElementById('error-msg')

            errorMsg.style.display = 'none'

            // Validaciones frontend
            if (!cuenta_destino || !concepto || !monto) {
                mostrarError('Todos los campos son obligatorios.')
                return
            }

            if (cuenta_destino.length !== 16) {
                mostrarError('El número de cuenta destino debe tener 16 dígitos.')
                return
            }

            if (monto < 500) {
                mostrarError('El monto mínimo es $500.00 MXN.')
                return
            }

            // Guardar datos para pantalla de confirmación
            sessionStorage.setItem('transferencia', JSON.stringify({
                cuenta_destino,
                concepto,
                monto
            }))

            window.location.href = 'confirmacion.html'
        }

        function mostrarError(msg) {
            const errorMsg = document.getElementById('error-msg')
            errorMsg.textContent = msg
            errorMsg.style.display = 'block'
        }
    </script>
</body>
</html>
